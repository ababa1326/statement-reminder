<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1400" height="560" fill="#faf7f2"/>
  <rect width="1400" height="10" fill="#1f6b4f"/>

  <!-- left: message -->
  <g transform="translate(90,120)">
    <g>
      <rect width="50" height="50" rx="11" fill="#1f6b4f"/>
      <path d="M25 12 v18 M25 30 l-7 -7 M25 30 l7 -7" fill="none" stroke="#faf7f2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="34" font-size="23" letter-spacing="3" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace" fill="#8a7f72" font-weight="600">STATEMENT<tspan fill="#14110f">REMINDER</tspan></text>
    </g>
    <text x="0" y="148" font-size="62" font-weight="700" fill="#14110f" letter-spacing="-1.5">Pay before the snapshot,</text>
    <text x="0" y="218" font-size="62" font-weight="700" letter-spacing="-1.5"><tspan fill="#1f6b4f">not the due date.</tspan></text>
    <text x="0" y="282" font-size="26" fill="#4a443c">Your credit card reports the balance it shows on the closing date.</text>
    <text x="0" y="318" font-size="26" fill="#4a443c">A badge countdown and a 3-day heads-up keep you ahead of it.</text>
  </g>

  <!-- right: mini popup mock -->
  <g transform="translate(1010,128)">
    <rect width="310" height="304" rx="16" fill="#ffffff" stroke="#e6ddd0" stroke-width="2"/>
    <g transform="translate(22,34)">
      <circle cx="5" cy="-5" r="4.5" fill="#1f6b4f"/>
      <text x="18" y="0" font-size="13.5" letter-spacing="2" font-family="ui-monospace, Menlo, monospace" fill="#8a7f72" font-weight="600">STATEMENT<tspan fill="#14110f">REMINDER</tspan></text>
    </g>
    <line x1="22" y1="52" x2="288" y2="52" stroke="#e6ddd0" stroke-width="2"/>
    <g transform="translate(22,70)">
      <rect width="266" height="62" rx="10" fill="#ffffff" stroke="#e6ddd0" stroke-width="2"/>
      <text x="16" y="28" font-size="16" font-weight="650" fill="#14110f">Chase Sapphire</text>
      <text x="16" y="48" font-size="12.5" fill="#8a7f72">closes the 25th</text>
      <rect x="198" y="17" width="50" height="28" rx="7" fill="#e3efe8"/>
      <text x="223" y="36" font-size="14" font-weight="650" font-family="ui-monospace, Menlo, monospace" fill="#1f6b4f" text-anchor="middle">14d</text>
    </g>
    <g transform="translate(22,144)">
      <rect width="266" height="62" rx="10" fill="#ffffff" stroke="#e6ddd0" stroke-width="2"/>
      <text x="16" y="28" font-size="16" font-weight="650" fill="#14110f">Amex Blue Cash</text>
      <text x="16" y="48" font-size="12.5" fill="#8a7f72">closes the 14th</text>
      <rect x="198" y="17" width="50" height="28" rx="7" fill="#f6e6db"/>
      <text x="223" y="36" font-size="14" font-weight="650" font-family="ui-monospace, Menlo, monospace" fill="#c4622d" text-anchor="middle">3d</text>
    </g>
    <text x="22" y="248" font-size="12" fill="#8a7f72">Pay down BEFORE the closing date —</text>
    <text x="22" y="266" font-size="12" fill="#8a7f72">that's the balance the bureaus see.</text>
  </g>
</svg>
